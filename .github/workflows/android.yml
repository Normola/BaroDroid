name: Android CI

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the release artifacts without publishing a release"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: barodroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

  gradle-latest:
    # Early warning for the next Gradle release; the wrapper stays on the
    # version the Android Gradle Plugin officially supports.
    name: Compatibility with the latest Gradle
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the latest Gradle release
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Assemble with the latest Gradle
        run: gradle --no-daemon assembleDebug

  release:
    name: Release
    needs: build
    # Real releases come from a v* tag; a manual run can rehearse the whole thing
    # and leave the APK, the QR code and the notes as workflow artifacts instead.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes walk the history back to the previous tag.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: meta
        run: |
          python3 .github/scripts/release_metadata.py \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --repo "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret; falling back to the debug key."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release APK
        env:
          BARODROID_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          BARODROID_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          BARODROID_KEYSTORE_FILE: ${{ steps.signing.outputs.path }}
          BARODROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BARODROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BARODROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${{ steps.meta.outputs.apk_name }}"

      - name: Generate the download QR code
        run: |
          python3 -m pip install --quiet --disable-pip-version-check qrcode pypng
          python3 .github/scripts/make_qr.py \
            "${{ steps.meta.outputs.download_url }}" \
            "dist/${{ steps.meta.outputs.qr_name }}"

      - name: Generate the release notes
        run: |
          python3 .github/scripts/release_notes.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --version-name "${{ steps.meta.outputs.version_name }}" \
            --apk "dist/${{ steps.meta.outputs.apk_name }}" \
            --download-url "${{ steps.meta.outputs.download_url }}" \
            --qr-url "${{ steps.meta.outputs.qr_url }}" \
            --signing "${{ steps.signing.outputs.mode }}" \
            --output dist/release-notes.md

      - name: Show the notes in the job summary
        run: cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rehearsal artifacts
        if: steps.meta.outputs.is_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: dist/**
          if-no-files-found: error

      - name: Publish the release
        if: steps.meta.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "BaroDroid ${{ steps.meta.outputs.version_name }}" \
            --notes-file dist/release-notes.md \
            "${args[@]}" \
            "dist/${{ steps.meta.outputs.apk_name }}" \
            "dist/${{ steps.meta.outputs.qr_name }}"
